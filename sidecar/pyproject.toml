[project]
name = "stillnote-moss-worker"
version = "0.1.0"
description = "MOSS 0.9B inference worker for the Stillnote macOS app"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
