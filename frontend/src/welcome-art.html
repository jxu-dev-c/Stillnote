<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stillnote welcome illustration</title>
    <style>
      :root { color: #8a9976; background: #f0f0e3; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; }
      .welcome-art { position: relative; width: 430px; height: 310px; display: flex; align-items: center; justify-content: center; font-family: Inter, system-ui, sans-serif; }
      .art-ring { position: absolute; border: 1px solid #dfe0ce; border-radius: 50%; width: 255px; height: 255px; opacity: .7; transform: rotate(-30deg) scaleX(1.02); }
      .ring-two { width: 330px; height: 330px; opacity: .45; transform: translate(13px, 2px) scaleX(1.07); }
      .ring-three { width: 405px; height: 405px; opacity: .25; transform: translate(22px, 1px) scaleX(1.07); }
      .art-paper { height: 173px; width: 185px; background: #fffdf3; border: 1px solid #f9f7e9; border-radius: 7px; box-shadow: 4px 12px 28px #6f744413; transform: rotate(-9deg); padding: 23px; position: relative; margin: 0 0 5px 17px; }
      .paper-dot { width: 12px; height: 12px; border-radius: 50%; background: #d7debc; display: block; margin-bottom: 12px; }
      .paper-line { height: 4px; width: 70px; background: #e6e9d5; display: block; border-radius: 4px; margin-top: 7px; }
      .paper-line.long { width: 95px; position: absolute; top: 24px; left: 43px; background: #cedab5; }
      .paper-line.short { width: 84px; }
      .paper-wave { height: 50px; display: flex; align-items: center; gap:4px; margin-top: 17px; }
      .paper-wave > span { width: 5px; background: #b3c28d; border-radius: 5px; }
      .paper-bottom { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
      .paper-bottom > span { width: 20px; height: 3px; background: #e0e5cd; border-radius: 5px; margin-right: auto; }
      .paper-bottom > i { width: 5px; height: 5px; border-radius: 50%; background: #dce2c7; }
      .art-speaker { position: absolute; top: 69%; left: 17%; background: #fffdf5; border: 1px solid #eeefdf; box-shadow: 0 5px 14px #5963380a; transform: rotate(5deg); padding: 11px 13px; display: flex; align-items: center; gap: 8px; border-radius: 7px; font-size: 9px; }
      .art-speaker svg { color: #aab899; }
      .art-sparkle { position: absolute; top: 16%; left: 77%; font: 300 44px Georgia, serif; color: #b7bb92; transform: rotate(12deg); }
      .art-label { position: absolute; top: 77%; left: 64%; width: 96px; font: italic 12px Georgia, serif; color: #a9ad8c; line-height: 1.4; transform: rotate(-7deg); }
      .art-arrow { position: absolute; width: 65px; left: 75%; top: 56%; color: #b8bfa0; transform: rotate(53deg); }
    </style>
  </head>
  <body>
    <div class="welcome-art" aria-label="Stillnote welcome illustration" role="img">
      <div class="art-ring ring-one"></div><div class="art-ring ring-two"></div><div class="art-ring ring-three"></div>
      <div class="art-paper"><span class="paper-dot"></span><span class="paper-line long"></span><span class="paper-line"></span><span class="paper-line short"></span><div class="paper-wave"><span style="height:11px"></span><span style="height:20px"></span><span style="height:32px"></span><span style="height:18px"></span><span style="height:39px"></span><span style="height:53px"></span><span style="height:36px"></span><span style="height:20px"></span><span style="height:28px"></span><span style="height:46px"></span><span style="height:29px"></span><span style="height:14px"></span><span style="height:22px"></span><span style="height:11px"></span></div><div class="paper-bottom"><span></span><i></i><i></i></div></div>
      <div class="art-speaker"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span>Every voice matters</span></div>
      <div class="art-sparkle">✳</div><span class="art-label">a thought worth keeping</span><svg class="art-arrow" viewBox="0 0 90 55" fill="none"><path d="M5 6c20-10 51 6 48 21-3 14-24-4-8-10 14-6 22 12 25 28M60 39l10 8 6-12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
  </body>
</html>
