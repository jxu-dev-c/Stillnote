[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stillnote"
version = "0.1.0"
description = "Private local meeting recording, speaker-aware transcription, and optional remote summaries"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "av>=14,<17",
  "torch>=2.6,<3",
  "transformers>=4.57,<5",
  "librosa>=0.11,<1",
  "vibevoice @ git+https://github.com/microsoft/VibeVoice.git@1541f590c7099820f10ea012f48d2399282df69f",
  "numpy>=1.26,<3",
  "huggingface-hub>=0.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
stillnote = "meeting_app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["backend/meeting_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.metadata]
allow-direct-references = true
