name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new commit on a pull request supersedes the run before it. Master is covered by Release,
  # which runs these same scripts.
  group: checks-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Run checks
        run: ./scripts/check.sh
      - name: Package development candidate
        run: ./scripts/package-app.sh
