name: Homebrew tap
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: An already published source release tag, such as v0.5.0.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: tap-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publish the tap
        env:
          # github.token cannot write to jxu-dev-c/homebrew-stillnote, so the tap needs a token
          # with contents write there and read on this repository.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          GIT_AUTHOR_NAME: stillnote-release
          GIT_AUTHOR_EMAIL: stillnote-release@users.noreply.github.com
          GIT_COMMITTER_NAME: stillnote-release
          GIT_COMMITTER_EMAIL: stillnote-release@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'HOMEBREW_TAP_TOKEN is not set, so brew users would keep the previous version.' >&2
            echo 'Add it as an Actions secret, then rerun this workflow with the release tag.' >&2
            exit 1
          fi
          gh auth setup-git
          ./scripts/publish-homebrew.sh "$RELEASE_TAG"
