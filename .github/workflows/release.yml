name: Release
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Releases must never run concurrently on master, and a queued run must not be cancelled
  # halfway through publishing.
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "Resources/Info.plist must hold MAJOR.MINOR.PATCH, not '$version'." >&2; exit 1; }
          # The version in Resources/Info.plist is the release trigger: a merge that bumps it to an
          # unreleased number publishes, any other merge only runs the checks below.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            release=false
            echo "v$version is already released; this run only validates master." >> "$GITHUB_STEP_SUMMARY"
          else
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          # The build number is the run number, so every build of a version is distinguishable.
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Run checks
        run: ./scripts/check.sh
      - name: Package the app and the Homebrew cask
        run: |
          ./scripts/package-app.sh
          python3 scripts/prepare-homebrew.py
      - name: Verify the candidate
        run: ./scripts/verify-candidate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.version.outputs.release == 'true'
        with:
          name: release-candidate
          path: build/candidate/
          if-no-files-found: error
          retention-days: 14
  homebrew:
    needs: build
    if: needs.build.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: build/candidate
      - name: Verify clean Homebrew install, repair, and uninstall
        run: ./scripts/check-homebrew.sh
  publish:
    needs: [build, homebrew]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: candidate
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd candidate
          shasum -a 256 -c SHA256SUMS
          # --target tags the released commit, so no tag is pushed by hand. Assets are uploaded
          # with the release, so a half-published version is never visible.
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Rerunning this job after the tap step failed must not repoint published assets.
            echo "Release $TAG already exists; leaving its assets unchanged."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file RELEASE-NOTES.md \
              "Stillnote-${TAG#v}-macos-arm64.zip" Stillnote-homebrew.tar.gz \
              Install-Stillnote.sh SHA256SUMS LICENSE THIRD_PARTY_NOTICES.md RELEASE-NOTES.md
          fi
      - name: Publish the Homebrew tap
        env:
          # github.token cannot write to jxu-dev-c/homebrew-stillnote, so the tap needs a token
          # with contents write there and read on this repository.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: v${{ needs.build.outputs.version }}
          GIT_AUTHOR_NAME: stillnote-release
          GIT_AUTHOR_EMAIL: stillnote-release@users.noreply.github.com
          GIT_COMMITTER_NAME: stillnote-release
          GIT_COMMITTER_EMAIL: stillnote-release@users.noreply.github.com
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'HOMEBREW_TAP_TOKEN is not set, so brew users would keep the previous version.' >&2
            exit 1
          fi
          gh auth setup-git
          ./scripts/publish-homebrew.sh "$TAG" candidate
