name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve release and validate toolchain
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          RELEASE_TAG="${RELEASE_TAG:-v$version}"
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected a vMAJOR.MINOR.PATCH tag.' >&2; exit 1; }
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo 'Tag must match CFBundleShortVersionString.' >&2; exit 1; }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
          [[ "$(uname -m)" == arm64 ]] || exit 1
          xcode_version=$(xcodebuild -version | awk '/^Xcode / {print $2}')
          [[ "${xcode_version%%.*}" -ge 26 ]] || exit 1
      - name: Prepare worker tests
        run: |
          python3 -m venv build/test-python
          build/test-python/bin/python -m pip install pytest ruff numpy packaging
      - name: Run checks
        env:
          STILLNOTE_TEST_PYTHON: ${{ github.workspace }}/build/test-python/bin/python
        run: ./scripts/check.sh
      - name: Package development candidate
        env:
          STILLNOTE_SIGNING_IDENTITY: '-'
          STILLNOTE_RELEASE_VERSION: ${{ steps.release.outputs.archive_version }}
        run: ./scripts/package-app.sh
      - name: Package offline speech runtime and Homebrew definitions
        run: |
          brew install python@3.13
          "$(brew --prefix python@3.13)/bin/python3.13" -m venv build/package-python
          build/package-python/bin/python -m pip install packaging
          build/package-python/bin/python scripts/package-runtime.py
          build/package-python/bin/python scripts/prepare-homebrew.py
      - name: Verify archive
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          (cd build/candidate && shasum -a 256 -c SHA256SUMS)
          extracted=$(mktemp -d)
          trap 'rm -rf "$extracted"' EXIT
          ditto -x -k "build/candidate/Stillnote-${RELEASE_TAG#v}-macos-arm64.zip" "$extracted"
          app="$extracted/Stillnote.app"
          codesign --verify --strict "$app"
          [[ "$(lipo -archs "$app/Contents/MacOS/Stillnote")" == arm64 ]] || exit 1
          [[ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" == "$APP_VERSION" ]] || exit 1
          [[ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Contents/Info.plist")" == "$GITHUB_RUN_NUMBER" ]] || exit 1
          test -x "$app/Contents/MacOS/Stillnote"
          for resource in AppIcon.icns speech_models.json LICENSE THIRD_PARTY_NOTICES.md; do
            test -s "$app/Contents/Resources/$resource"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: build/candidate/
          if-no-files-found: error
          retention-days: 14
  homebrew:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: build/candidate
      - name: Verify clean Homebrew install, repair, and uninstall
        run: ./scripts/check-homebrew.sh
  publish:
    needs: [build, homebrew]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: candidate
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sha256sum -c SHA256SUMS
          # Listing must succeed: authentication/network errors must not mean "absent".
          releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft")
          if [[ -n "$releases" ]]; then
            if [[ "$releases" == false ]]; then
              echo "Release $RELEASE_TAG is already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file RELEASE-NOTES.md
          fi
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]] || exit 1
          gh release upload "$RELEASE_TAG" --clobber \
            "Stillnote-${RELEASE_TAG#v}-macos-arm64.zip" \
            "Stillnote-runtime-${RELEASE_TAG#v}-macos-arm64.tar.gz" Stillnote-homebrew.tar.gz \
            Install-Stillnote.sh SHA256SUMS LICENSE THIRD_PARTY_NOTICES.md RELEASE-NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false
