name: Release candidate
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate version and toolchain
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          [[ "$RELEASE_TAG" == "v$version" ]] || exit 1
          [[ "$(uname -m)" == arm64 ]] || exit 1
          xcode_version=$(xcodebuild -version | awk '/^Xcode / {print $2}')
          [[ "${xcode_version%%.*}" -ge 26 ]] || exit 1
      - name: Prepare worker tests
        run: |
          python3 -m venv build/test-python
          build/test-python/bin/python -m pip install pytest ruff numpy
      - name: Run checks
        env:
          STILLNOTE_TEST_PYTHON: ${{ github.workspace }}/build/test-python/bin/python
        run: ./scripts/check.sh
      - name: Package development candidate
        env:
          STILLNOTE_SIGNING_IDENTITY: '-'
        run: ./scripts/package-app.sh
      - name: Verify archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd build/candidate && shasum -a 256 -c SHA256SUMS)
          extracted=$(mktemp -d)
          trap 'rm -rf "$extracted"' EXIT
          ditto -x -k "build/candidate/Stillnote-${RELEASE_TAG#v}-macos-arm64.zip" "$extracted"
          app="$extracted/Stillnote.app"
          codesign --verify --strict "$app"
          [[ "$(lipo -archs "$app/Contents/MacOS/Stillnote")" == arm64 ]] || exit 1
          [[ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" == "${RELEASE_TAG#v}" ]] || exit 1
          test -x "$app/Contents/MacOS/Stillnote"
          for resource in speech_models.json LICENSE THIRD_PARTY_NOTICES.md; do
            test -s "$app/Contents/Resources/$resource"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: build/candidate/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: candidate
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sha256sum -c SHA256SUMS
          # Listing must succeed: authentication/network errors must not mean "absent".
          releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft")
          if [[ -n "$releases" ]]; then
            [[ "$releases" == true ]] || { echo 'Refusing to modify a published release.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "Stillnote $RELEASE_TAG — development candidate" --notes-file RELEASE-NOTES.md
          fi
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]] || exit 1
          gh release upload "$RELEASE_TAG" --clobber \
            "Stillnote-${RELEASE_TAG#v}-macos-arm64.zip" SHA256SUMS LICENSE THIRD_PARTY_NOTICES.md RELEASE-NOTES.md
